# Validate Node-RED flow JSON on pull requests and on pushes to main.
# This does not deploy. Deployment stays in deploy-flows.yml.

name: Validate Node-RED Flows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate flow JSON
        run: python3 scripts/validate_flows.py

      - name: Assert paused outbound tabs stay disabled
        run: python3 scripts/check_paused_tabs.py

      - name: Test the validator
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the Node-RED image
        run: docker build -t shamrock-node-red:ci .

  entrypoint-boot:
    name: Entrypoint boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Empty node_modules and root-owned flows.json
        run: bash scripts/test_entrypoint_boot.sh
